[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "schemagatedai"
version = "0.1.0"
description = "Incremental JSON gate for streamed local-model output"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "RequiredTruth"}]
[project.scripts]
schemagatedai = "schemagatedai.cli:main"
[tool.setuptools.packages.find]
include = ["schemagatedai*"]
